name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Check version consistency
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PYPROJECT=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          PACKAGE=$(grep -m1 '^__version__' src/bester_ytm/__init__.py | cut -d'"' -f2)
          echo "tag=$TAG pyproject=$PYPROJECT package=$PACKAGE"
          [ "$TAG" = "$PYPROJECT" ] || { echo "::error::tag v$TAG != pyproject.toml version $PYPROJECT"; exit 1; }
          [ "$TAG" = "$PACKAGE" ] || { echo "::error::tag v$TAG != __version__ $PACKAGE"; exit 1; }
          grep -q "^## \[$TAG\]" CHANGELOG.md || { echo "::error::CHANGELOG.md has no section for $TAG"; exit 1; }

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          python-version: "3.13"

      - name: Run checks
        run: |
          uv sync
          uv run ruff check .
          uv run mypy src
          uv run pytest -q --cov=bester_ytm --cov-fail-under=80

      - name: Extract release notes from CHANGELOG.md
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '/^## \[/{p=($0 ~ "^## \\["ver"\\]")} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "bester-ytm $GITHUB_REF_NAME" \
            --notes-file notes.md
