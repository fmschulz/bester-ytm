site_name: bester-ytm
site_description: Local terminal YouTube Music companion with DJ-style crossfades
site_url: https://fmschulz.github.io/bester-ytm/
repo_url: https://github.com/fmschulz/bester-ytm
repo_name: fmschulz/bester-ytm

theme:
  name: material
  palette:
    - scheme: slate
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-7
        name: Switch to light mode
    - scheme: default
      primary: deep orange
      accent: deep orange
      toggle:
        icon: material/brightness-4
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Usage: usage.md
  - Playlist Builder & AI: builder.md
  - Configuration: configuration.md
  - Architecture: architecture.md
  - Development: development.md
  - Manual Testing: manual-testing.md
  - Troubleshooting: troubleshooting.md
